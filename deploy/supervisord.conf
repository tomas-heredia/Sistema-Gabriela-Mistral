[supervisord]
nodaemon=true
user=root

; Sin esto "supervisorctl status" no tiene a donde conectarse (no hay
; error real sin el socket -- los programas de arriba arrancan igual --
; pero deja sin forma facil de inspeccionarlos desde adentro del contenedor).
[unix_http_server]
file=/run/supervisord.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisord.sock

[program:php-fpm]
command=php-fpm -F
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Procesa los jobs encolados (QUEUE_CONNECTION=database) -- ej. generar y
; enviar el PDF de boletines. --tries=3 para no reintentar infinito un job
; roto; --sleep=3 para no ametrallar la tabla `jobs` cuando está vacía.
[program:queue-worker]
command=php /var/www/html/artisan queue:work --sleep=3 --tries=3 --max-time=3600
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Reemplaza al cron del sistema: corre el scheduler de Laravel cada minuto
; (mora:generar-avisos vive ahí, ver routes/console.php).
[program:scheduler]
command=/bin/sh -c "while true; do php /var/www/html/artisan schedule:run --verbose --no-interaction; sleep 60; done"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
