version: "3.8"

services:
  app:
    image: gabriela-mistral-app:${APP_IMAGE_TAG}
    ports:
      - target: 8080
        published: 8080
        mode: host
    environment:
      APP_NAME: ${APP_NAME}
      APP_ENV: production
      APP_KEY: ${APP_KEY}
      APP_DEBUG: "false"
      APP_URL: ${APP_URL}
      APP_LOCALE: es
      APP_FALLBACK_LOCALE: es
      LOG_CHANNEL: stderr
      LOG_LEVEL: info
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      SESSION_DRIVER: database
      SESSION_SECURE_COOKIE: "false"
      FILESYSTEM_DISK: local
      QUEUE_CONNECTION: database
      CACHE_STORE: database
      MAIL_MAILER: smtp
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS}
      RESTRINGIR_ACCESO_RED: "${RESTRINGIR_ACCESO_RED}"
    volumes:
      - app_storage:/var/www/html/storage/app
    networks:
      - gabriela-mistral
      - easypanel
    labels:
      # Traefik (ya corre en la VPS para EasyPanel/n8n, providers.docker con
      # exposedByDefault=false) -- estas etiquetas son lo único que lo hace
      # enrutar tráfico hacia este contenedor; no tocan nada de los otros
      # stacks. HTTPS gratis vía sslip.io (resuelve solo a esta IP, sin
      # necesidad de comprar un dominio) usando el certresolver "letsencrypt"
      # que el Traefik ya tiene configurado.
      - traefik.enable=true
      - traefik.http.services.gabriela-mistral.loadbalancer.server.port=8080
      # Sin esto, Traefik solo se entera de que un contenedor viejo ya no
      # existe cuando le llega el evento de Docker correspondiente -- en un
      # deploy (swarm reemplaza el contenedor) hay una ventana de varios
      # minutos donde sigue repartiendo pedidos reales al contenedor
      # apagado, que cuelgan ~30s y terminan en 504. Con esto Traefik prueba
      # cada backend por su cuenta cada 2s y saca al que no contesta, sin
      # depender de esa sincronización con Docker.
      - traefik.http.services.gabriela-mistral.loadbalancer.healthcheck.path=/up
      - traefik.http.services.gabriela-mistral.loadbalancer.healthcheck.interval=2s
      - traefik.http.services.gabriela-mistral.loadbalancer.healthcheck.timeout=2s
      - traefik.http.routers.gabriela-mistral-https.rule=Host(`76-13-166-178.sslip.io`)
      - traefik.http.routers.gabriela-mistral-https.entrypoints=https
      - traefik.http.routers.gabriela-mistral-https.tls=true
      - traefik.http.routers.gabriela-mistral-https.tls.certresolver=letsencrypt
      - traefik.http.routers.gabriela-mistral-http.rule=Host(`76-13-166-178.sslip.io`)
      - traefik.http.routers.gabriela-mistral-http.entrypoints=http
      - traefik.http.routers.gabriela-mistral-http.middlewares=gabriela-mistral-https-redirect
      - traefik.http.middlewares.gabriela-mistral-https-redirect.redirectscheme.scheme=https
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/up"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - gabriela-mistral
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

networks:
  gabriela-mistral:
    external: true
    name: easypanel-gabriela-mistral
  easypanel:
    external: true
    name: easypanel

volumes:
  app_storage:
  mysql_data:
